title: Sreaper's Lab
description: Ciberseguridad, infraestructura, DevOps y programación
theme: jekyll-theme-slate
linkedin_url: "https://www.linkedin.com/in/salvador-manrubia"

collections:
  writeups:
    output: true
    permalink: /writeups/:path/
  notes:
    output: true
    permalink: /apuntes/:path/

defaults:
  - scope:
      path: ""
      type: writeups
    values:
      layout: default
  - scope:
      path: ""
      type: notes
    values:
      layout: default

show_excerpts: false
